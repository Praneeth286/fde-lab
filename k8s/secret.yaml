# LAB ONLY. This password is a throwaway against a local Postgres.
# Kubernetes Secrets are base64-encoded, NOT encrypted. kubectl apply also stores the
# plaintext in the last-applied-configuration annotation. Never commit a real credential
# this way — use Sealed Secrets, External Secrets Operator (Vault / AWS Secrets Manager),
# or SOPS-encrypted manifests.
apiVersion: v1
kind: Secret
metadata:
  name: claim-api-secret
type: Opaque
stringData:
  DB_USER: claims
  DB_PASSWORD: changeme